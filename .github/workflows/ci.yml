name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo cancela la corrida anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests y build
    runs-on: ubuntu-latest

    # Base descartable. Sirve para correr `prisma migrate deploy` de verdad:
    # si una migracion no aplica sobre una base limpia, el PR se pone rojo en
    # vez de romper produccion.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jfstudio_ci
        ports:
          - 5432:5432
        # Sin -U/-d, pg_isready asume el usuario del sistema (root) y el log se
        # llena de 'role "root" does not exist' sin comprobar la base real.
        options: >-
          --health-cmd "pg_isready -U postgres -d jfstudio_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jfstudio_ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # En Railway esto corre como pre-deploy, no en el build (ver railway.json).
      # Aca lo corremos aparte para validar la cadena completa de migraciones
      # sobre una base vacia antes de mergear.
      - name: Migraciones
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build
